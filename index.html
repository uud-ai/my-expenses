<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансы — Сегодня</title>
    
    <!-- Настройки для запуска как полноценное мобильное приложение (без рамок браузера) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Финансы">
    
    <!-- Встроенная SVG-иконка (белый знак рубля на глубоком премиальном темном фоне) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180' width='180' height='180'><rect width='180' height='180' rx='44' fill='%231d1d1f'/><text x='90' y='112' font-family='Plus Jakarta Sans, -apple-system, sans-serif' font-size='95' font-weight='700' fill='white' text-anchor='middle'>₽</text></svg>">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180' width='180' height='180'><rect width='180' height='180' rx='44' fill='%231d1d1f'/><text x='90' y='112' font-family='Plus Jakarta Sans, -apple-system, sans-serif' font-size='95' font-weight='700' fill='white' text-anchor='middle'>₽</text></svg>">

    <!-- Встроенный веб-манифест для Android-устройств -->
    <link rel="manifest" href="data:application/json,{%22name%22:%22Финансы%22,%22short_name%22:%22Финансы%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23f5f5f7%22,%22theme_color%22:%22%23f5f5f7%22}">

    <!-- Tailwind CSS для быстрого Apple-стиля -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Плавное появление элементов списка */
        .expense-card {
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-[#f5f5f7] text-[#1d1d1f] min-h-screen flex flex-col justify-between antialiased">

    <!-- Основной контейнер приложения -->
    <main class="w-full max-w-md mx-auto px-6 pt-12 pb-32 flex-grow">
        
        <!-- Верхняя панель: Дата и заголовок -->
        <header class="mb-10">
            <p id="current-date" class="text-xs font-semibold text-[#86868b] uppercase tracking-wider mb-1">Загрузка даты...</p>
            <h1 class="text-4xl font-bold tracking-tight mb-6">Сегодня</h1>
            
            <!-- Карточка Общей Суммы -->
            <div class="bg-white rounded-3xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.02)] border border-black/[0.02] transition-all">
                <p class="text-xs font-medium text-[#86868b] uppercase tracking-wider mb-1">Всего потрачено</p>
                <div class="flex items-baseline gap-1">
                    <span id="total-amount" class="text-5xl font-bold tracking-tight text-[#1d1d1f]">0</span>
                    <span class="text-3xl font-semibold text-[#1d1d1f]">₽</span>
                </div>
            </div>
        </header>

        <!-- Раздел со списком трат -->
        <section>
            <h2 class="text-lg font-semibold mb-4 text-[#1d1d1f] flex justify-between items-center">
                <span>Список расходов</span>
                <span id="items-count" class="text-xs bg-[#e8e8ed] px-2.5 py-1 rounded-full text-[#86868b]">0</span>
            </h2>
            
            <!-- Контейнер для списка -->
            <div id="expense-list" class="space-y-3">
                <!-- Сюда JS будет рендерить карточки расходов -->
            </div>

            <!-- Заглушка, если расходов нет -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 text-center">
                <div class="w-16 h-16 bg-[#e8e8ed] text-[#86868b] rounded-full flex items-center justify-center mb-4 text-xl">
                    <i class="fa-solid fa-receipt"></i>
                </div>
                <h3 class="font-medium text-[#1d1d1f] mb-1">Нет расходов</h3>
                <p class="text-sm text-[#86868b] max-w-[200px]">Нажмите кнопку ниже, чтобы добавить первую трату за сегодня.</p>
            </div>
        </section>

    </main>

    <!-- Фиксированная нижняя плашка с кнопкой добавления -->
    <div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#f5f5f7] via-[#f5f5f7] to-transparent pointer-events-none">
        <div class="max-w-md mx-auto flex justify-center">
            <button id="open-modal-btn" class="pointer-events-auto w-full bg-[#1d1d1f] hover:bg-[#313135] active:scale-[0.98] text-white py-4.5 rounded-2xl font-semibold text-base transition-all duration-200 shadow-lg shadow-black/10 flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus text-sm"></i>
                Добавить расход
            </button>
        </div>
    </div>

    <!-- Всплывающая шторка (Модальное окно / Action Sheet) -->
    <div id="modal" class="fixed inset-0 z-50 invisible transition-all duration-300">
        <!-- Задний затемненный фон (блюр в стиле Apple) -->
        <div id="modal-overlay" class="absolute inset-0 bg-black/20 backdrop-blur-md opacity-0 transition-opacity duration-300"></div>
        
        <!-- Сама шторка -->
        <div id="modal-sheet" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[32px] p-6 max-w-md mx-auto transform translate-y-full transition-transform duration-300 shadow-[0_-10px_40px_rgba(0,0,0,0.06)]">
            
            <!-- Индикатор перетаскивания (Home Indicator Look) -->
            <div class="w-12 h-1.5 bg-[#e8e8ed] rounded-full mx-auto mb-6"></div>
            
            <h3 class="text-2xl font-bold tracking-tight mb-6">Новый расход</h3>
            
            <!-- Форма -->
            <form id="expense-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-[#86868b] uppercase tracking-wider mb-2">Название расхода</label>
                    <input type="text" id="expense-name" placeholder="Например, Кофе, Такси, Обед" required
                           class="w-full bg-[#f5f5f7] focus:bg-white border-2 border-transparent focus:border-[#0071e3] rounded-2xl px-4 py-3.5 outline-none transition-all duration-200 text-base font-medium placeholder-[#86868b]">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-[#86868b] uppercase tracking-wider mb-2">Сумма (₽)</label>
                    <input type="number" id="expense-amount" placeholder="0" min="1" step="any" required
                           class="w-full bg-[#f5f5f7] focus:bg-white border-2 border-transparent focus:border-[#0071e3] rounded-2xl px-4 py-3.5 outline-none transition-all duration-200 text-base font-medium placeholder-[#86868b]">
                </div>
                
                <!-- Кнопки действий -->
                <div class="grid grid-cols-2 gap-3 pt-4">
                    <button type="button" id="close-modal-btn" class="bg-[#f5f5f7] hover:bg-[#e8e8ed] active:scale-[0.98] text-[#1d1d1f] py-4 rounded-2xl font-semibold text-sm transition-all duration-200">
                        Отмена
                    </button>
                    <button type="submit" class="bg-[#0071e3] hover:bg-[#0077ed] active:scale-[0.98] text-white py-4 rounded-2xl font-semibold text-sm transition-all duration-200 shadow-md shadow-[#0071e3]/10">
                        Сохранить
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Логика работы приложения (JS) -->
    <script>
        // Инициализация данных
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

        // DOM элементы
        const currentDateEl = document.getElementById('current-date');
        const totalAmountEl = document.getElementById('total-amount');
        const itemsCountEl = document.getElementById('items-count');
        const expenseListEl = document.getElementById('expense-list');
        const emptyStateEl = document.getElementById('empty-state');
        
        const modal = document.getElementById('modal');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalSheet = document.getElementById('modal-sheet');
        const openModalBtn = document.getElementById('open-modal-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const expenseForm = document.getElementById('expense-form');
        
        const expenseNameInput = document.getElementById('expense-name');
        const expenseAmountInput = document.getElementById('expense-amount');

        // Установка текущей даты на русском языке
        function setLocalDate() {
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            const today = new Date();
            const formattedDate = today.toLocaleDateString('ru-RU', options);
            currentDateEl.textContent = formattedDate;
        }

        // Обновление интерфейса
        function updateUI() {
            expenseListEl.innerHTML = '';
            let total = 0;

            if (expenses.length === 0) {
                emptyStateEl.classList.remove('hidden');
                itemsCountEl.textContent = '0';
            } else {
                emptyStateEl.classList.add('hidden');
                itemsCountEl.textContent = expenses.length;

                expenses.forEach((item, index) => {
                    total += parseFloat(item.amount);

                    const expenseCard = document.createElement('div');
                    expenseCard.className = 'expense-card bg-white rounded-2xl p-4 flex justify-between items-center shadow-[0_4px_20px_rgb(0,0,0,0.01)] border border-black/[0.01]';
                    
                    expenseCard.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-[#f5f5f7] text-[#1d1d1f] rounded-full flex items-center justify-center text-sm font-semibold">
                                ${item.name.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <p class="font-semibold text-[#1d1d1f] text-base leading-tight">${item.name}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="font-bold text-base text-[#1d1d1f]">${parseFloat(item.amount).toLocaleString('ru-RU')} ₽</span>
                            <button onclick="deleteExpense(${index})" class="text-[#86868b] hover:text-[#ff453a] active:scale-95 transition-all p-1">
                                <i class="fa-regular fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    `;
                    expenseListEl.appendChild(expenseCard);
                });
            }

            // Форматируем общую сумму с пробелами
            totalAmountEl.textContent = total.toLocaleString('ru-RU');
        }

        // Сохранение в LocalStorage
        function saveData() {
            localStorage.setItem('expenses', JSON.stringify(expenses));
        }

        // Добавление расхода
        expenseForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = expenseNameInput.value.trim();
            const amount = parseFloat(expenseAmountInput.value);

            if (name && amount > 0) {
                expenses.unshift({ name, amount });
                saveData();
                updateUI();
                closeModal();
                expenseForm.reset();
            }
        });

        // Удаление расхода
        function deleteExpense(index) {
            expenses.splice(index, 1);
            saveData();
            updateUI();
        }

        // Управление модальным окном
        function openModal() {
            modal.classList.remove('invisible');
            modalOverlay.classList.remove('opacity-0');
            modalOverlay.classList.add('opacity-100');
            modalSheet.classList.remove('translate-y-full');
            // Фокусируем поле ввода
            setTimeout(() => expenseNameInput.focus(), 150);
        }

        function closeModal() {
            modalOverlay.classList.remove('opacity-100');
            modalOverlay.classList.add('opacity-0');
            modalSheet.classList.add('translate-y-full');
            
            setTimeout(() => {
                modal.classList.add('invisible');
            }, 300);
        }

        // События модального окна
        openModalBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', closeModal);

        // Старт приложения
        setLocalDate();
        updateUI();
    </script>
</body>
</html>
